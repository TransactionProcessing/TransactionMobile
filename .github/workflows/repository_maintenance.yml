name: Maintenance Tasks

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup-stale-branches:
    uses: TransactionProcessing/org-ci-workflows/.github/workflows/cleanup-stale-branches.yml@main
    with:
      stale-days: ${{ fromJSON(vars.STALE_BRANCH_DAYS || '60') }}
      dry-run: false
